<!doctype html><html lang="ru"><meta charset="utf-8"><title>SVG в PNG</title>
<h1>Экспорт собственного SVG в PNG</h1><p>Откройте SVG с явно заданными width и height. Утилита сохраняет изображение без изменения композиции.</p><input id="file" type="file" accept="image/svg+xml"><canvas id="canvas"></canvas>
<script>document.getElementById('file').onchange=async(event)=>{const file=event.target.files[0];if(!file)return;const image=new Image();const url=URL.createObjectURL(file);image.onload=()=>{const canvas=document.getElementById('canvas');canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;canvas.getContext('2d').drawImage(image,0,0);const a=document.createElement('a');a.download='result.png';a.href=canvas.toDataURL('image/png');a.click();URL.revokeObjectURL(url);};image.src=url;};</script></html>
